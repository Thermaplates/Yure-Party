<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glowArch">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="30" fill="#0b1329" />
  <!-- Circuit Grid -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#1e293b" stroke-width="3" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#archGrad)" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  
  <!-- Cybernetic Hexagon Badge -->
  <polygon points="200,60 310,125 310,255 200,320 90,255 90,125" fill="#0f172a" stroke="url(#archGrad)" stroke-width="3" filter="url(#glowArch)" />
  
  <!-- Silhouette & Gamepad / Code Symbol -->
  <!-- Game Controller & Code Brackets -->
  <g filter="url(#glowArch)" transform="translate(130, 140)">
    <!-- Controller Body -->
    <path d="M20,40 C20,20 40,15 70,15 C100,15 120,20 120,40 C120,70 100,85 85,85 C75,85 70,75 70,75 C70,75 65,85 55,85 C40,85 20,70 20,40 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <!-- D-Pad -->
    <rect x="35" y="32" width="18" height="6" rx="2" fill="#38bdf8" />
    <rect x="41" y="26" width="6" height="18" rx="2" fill="#38bdf8" />
    <!-- Buttons -->
    <circle cx="95" cy="30" r="3" fill="#38bdf8" />
    <circle cx="105" cy="36" r="3" fill="#06b6d4" />
    <circle cx="85" cy="36" r="3" fill="#06b6d4" />
    <circle cx="95" cy="42" r="3" fill="#38bdf8" />
  </g>

  <!-- Code Brackets Overlay -->
  <text x="65" y="210" font-family="'Courier New', monospace" font-size="44" font-weight="900" fill="#38bdf8" opacity="0.85">&lt;/&gt;</text>
  <text x="270" y="210" font-family="'Courier New', monospace" font-size="44" font-weight="900" fill="#06b6d4" opacity="0.85">{ }</text>

  <!-- Title Badge -->
  <rect x="90" y="335" width="220" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="200" y="357" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#38bdf8" letter-spacing="1.5">GAME DEVELOPER</text>
</svg>
