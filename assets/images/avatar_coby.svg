<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cobyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glowCoby">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="30" fill="#180b1e" />
  
  <circle cx="200" cy="200" r="160" fill="none" stroke="#2e1039" stroke-width="3" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#cobyGrad)" stroke-width="2" stroke-dasharray="8,6" opacity="0.4" />
  
  <!-- Diamond Art Shield -->
  <polygon points="200,50 310,160 200,290 90,160" fill="#240c2e" stroke="url(#cobyGrad)" stroke-width="3" filter="url(#glowCoby)" />
  
  <!-- Artist Palette & Stylus -->
  <g filter="url(#glowCoby)" transform="translate(145, 110)">
    <!-- Palette Shape -->
    <path d="M55,10 C20,10 5,35 5,65 C5,95 30,110 60,110 C75,110 85,100 85,90 C85,82 75,78 75,68 C75,60 82,55 90,55 C105,55 115,40 115,25 C115,12 85,10 55,10 Z" fill="#3b0740" stroke="#f472b6" stroke-width="3" />
    <!-- Color Swatches -->
    <circle cx="30" cy="40" r="7" fill="#fb7185" />
    <circle cx="50" cy="30" r="7" fill="#fbbf24" />
    <circle cx="75" cy="30" r="7" fill="#38bdf8" />
    <circle cx="35" cy="70" r="7" fill="#a855f7" />
    <circle cx="58" cy="85" r="7" fill="#34d399" />
    <!-- Thumb Hole -->
    <ellipse cx="92" cy="78" rx="6" ry="9" fill="#180b1e" stroke="#f472b6" stroke-width="2" />
  </g>

  <!-- Glowing Digital Pen / Stylus Crossing -->
  <g transform="rotate(35 200 200)">
    <line x1="196" y1="90" x2="196" y2="280" stroke="url(#brushGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glowCoby)" />
    <polygon points="196,80 190,95 202,95" fill="#fbbf24" filter="url(#glowCoby)" />
  </g>

  <!-- Title Badge -->
  <rect x="90" y="335" width="220" height="34" rx="17" fill="#2e1039" stroke="#ec4899" stroke-width="1.5" />
  <text x="200" y="357" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#f472b6" letter-spacing="1.5">ART DIRECTOR</text>
</svg>
