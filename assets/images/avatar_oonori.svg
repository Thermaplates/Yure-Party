<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="oonoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glowOonori">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="30" fill="#061c16" />
  
  <circle cx="200" cy="200" r="160" fill="none" stroke="#064e3b" stroke-width="3" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#oonoGrad)" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  
  <!-- Isometric Asset Cubes / Diamond Shape -->
  <g filter="url(#glowOonori)" transform="translate(200, 160)">
    <!-- Main Center Isometric Tile -->
    <!-- Top Face -->
    <polygon points="0,-40 50,-15 0,10 -50,-15" fill="url(#cubeTop)" stroke="#6ee7b7" stroke-width="2" />
    <!-- Left Face -->
    <polygon points="-50,-15 0,10 0,65 -50,40" fill="#047857" stroke="#6ee7b7" stroke-width="2" />
    <!-- Right Face -->
    <polygon points="0,10 50,-15 50,40 0,65" fill="#065f46" stroke="#6ee7b7" stroke-width="2" />

    <!-- Floating Mini Sprites / Pixels around tile -->
    <rect x="-85" y="-60" width="14" height="14" rx="2" fill="#34d399" opacity="0.9" />
    <rect x="70" y="-50" width="14" height="14" rx="2" fill="#6ee7b7" opacity="0.9" />
    <rect x="-90" y="20" width="12" height="12" rx="2" fill="#10b981" opacity="0.8" />
    <rect x="75" y="30" width="12" height="12" rx="2" fill="#34d399" opacity="0.8" />

    <polygon points="0,-75 25,-60 0,-45 -25,-60" fill="#a7f3d0" stroke="#34d399" stroke-width="1.5" />
  </g>

  <!-- Pixel Grid Overlay Corner Markers -->
  <path d="M70,120 L70,80 L110,80" fill="none" stroke="#10b981" stroke-width="3" opacity="0.7" />
  <path d="M330,120 L330,80 L290,80" fill="none" stroke="#10b981" stroke-width="3" opacity="0.7" />
  <path d="M70,280 L70,320 L110,320" fill="none" stroke="#10b981" stroke-width="3" opacity="0.7" />
  <path d="M330,280 L330,320 L290,320" fill="none" stroke="#10b981" stroke-width="3" opacity="0.7" />

  <!-- Title Badge -->
  <rect x="90" y="335" width="220" height="34" rx="17" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="200" y="357" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#6ee7b7" letter-spacing="1.5">ASSET DIRECTOR</text>
</svg>
