<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="renGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glowRenpoo">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="30" fill="#140c24" />
  
  <circle cx="200" cy="200" r="160" fill="none" stroke="#2e1065" stroke-width="3" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#renGrad)" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  
  <!-- Studio Headphones & Audio Waves -->
  <g filter="url(#glowRenpoo)" transform="translate(130, 85)">
    <!-- Headband -->
    <path d="M10,80 C10,15 130,15 130,80" fill="none" stroke="url(#renGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M25,65 C25,30 115,30 115,65" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4" />
    
    <!-- Left Earcup -->
    <rect x="-4" y="70" width="28" height="52" rx="14" fill="#3b0764" stroke="#c084fc" stroke-width="3" />
    <circle cx="10" cy="96" r="6" fill="#f43f5e" />

    <!-- Right Earcup -->
    <rect x="116" y="70" width="28" height="52" rx="14" fill="#3b0764" stroke="#c084fc" stroke-width="3" />
    <circle cx="130" cy="96" r="6" fill="#f43f5e" />
  </g>

  <!-- Equalizer Spectrum Bars -->
  <g filter="url(#glowRenpoo)" transform="translate(110, 230)">
    <rect x="0" y="15" width="8" height="30" rx="4" fill="url(#waveGrad)" />
    <rect x="15" y="5" width="8" height="50" rx="4" fill="url(#waveGrad)" />
    <rect x="30" y="-10" width="8" height="80" rx="4" fill="url(#waveGrad)" />
    <rect x="45" y="10" width="8" height="40" rx="4" fill="url(#waveGrad)" />
    <rect x="60" y="-20" width="8" height="100" rx="4" fill="#ffffff" />
    <rect x="75" y="-5" width="8" height="70" rx="4" fill="url(#waveGrad)" />
    <rect x="90" y="12" width="8" height="36" rx="4" fill="url(#waveGrad)" />
    <rect x="105" y="-15" width="8" height="90" rx="4" fill="url(#waveGrad)" />
    <rect x="120" y="5" width="8" height="50" rx="4" fill="url(#waveGrad)" />
    <rect x="135" y="20" width="8" height="20" rx="4" fill="url(#waveGrad)" />
    <!-- Musical Clef / Note accent -->
    <circle cx="165" cy="5" r="8" fill="#c084fc" />
    <rect x="171" y="-25" width="4" height="30" rx="2" fill="#c084fc" />
    <path d="M175,-25 C185,-25 190,-15 185,-5" fill="none" stroke="#c084fc" stroke-width="3" />
  </g>

  <!-- Title Badge -->
  <rect x="90" y="335" width="220" height="34" rx="17" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="200" y="357" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#c084fc" letter-spacing="1.5">COMPOSER MUSIC</text>
</svg>
