<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ballroomBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f091c" />
      <stop offset="60%" stop-color="#2d124d" />
      <stop offset="100%" stop-color="#080312" />
    </linearGradient>
    <radialGradient id="chandelierGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2d124d" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="450" rx="12" fill="url(#ballroomBg)" />
  <circle cx="300" cy="110" r="180" fill="url(#chandelierGlow)" />
  
  <!-- Gothic Grand Windows -->
  <path d="M70,220 C70,120 130,120 130,220 L130,300 L70,300 Z" fill="#38bdf8" opacity="0.3" stroke="#818cf8" stroke-width="2" />
  <path d="M470,220 C470,120 530,120 530,220 L530,300 L470,300 Z" fill="#38bdf8" opacity="0.3" stroke="#818cf8" stroke-width="2" />
  <path d="M250,180 C250,80 350,80 350,180 L350,280 L250,280 Z" fill="#e0e7ff" opacity="0.4" stroke="#c7d2fe" stroke-width="2" />

  <!-- Marble Columns -->
  <rect x="160" y="80" width="30" height="260" fill="#1e1b4b" stroke="#4338ca" stroke-width="2" />
  <rect x="410" y="80" width="30" height="260" fill="#1e1b4b" stroke="#4338ca" stroke-width="2" />

  <!-- Chandelier -->
  <line x1="300" y1="0" x2="300" y2="70" stroke="#f59e0b" stroke-width="3" />
  <ellipse cx="300" cy="70" rx="45" ry="10" fill="none" stroke="#f59e0b" stroke-width="3" />
  <circle cx="260" cy="70" r="5" fill="#fef08a" />
  <circle cx="300" cy="73" r="6" fill="#fef08a" />
  <circle cx="340" cy="70" r="5" fill="#fef08a" />

  <!-- Checkered Dance Floor -->
  <polygon points="0,450 600,450 480,310 120,310" fill="#0c0a1a" stroke="#4c1d95" stroke-width="2" />
  
  <!-- Phantom Couple Silhouette dancing -->
  <g transform="translate(270, 240)">
    <circle cx="20" cy="20" r="10" fill="#a855f7" opacity="0.8" />
    <path d="M10,32 C10,32 5,75 35,75 C35,75 30,32 10,32 Z" fill="#c084fc" opacity="0.7" />
    <circle cx="45" cy="22" r="9" fill="#ec4899" opacity="0.8" />
    <path d="M38,33 C38,33 50,45 60,65 C60,65 30,70 38,33 Z" fill="#f472b6" opacity="0.7" />
  </g>

  <!-- Caption overlay -->
  <rect x="0" y="380" width="600" height="70" fill="black" opacity="0.75" />
  <text x="30" y="410" font-family="'Outfit', sans-serif" font-weight="700" font-size="17" fill="#ffffff">The Grand Ballroom Key Art</text>
  <text x="30" y="432" font-family="'Outfit', sans-serif" font-size="13" fill="#c084fc">Art Direction by Coby novaenan · Yure Party</text>
</svg>
