<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051410" />
      <stop offset="100%" stop-color="#0a2b22" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="12" fill="url(#tileBg)" />

  <!-- Isometric Tiles Grid -->
  <g transform="translate(300, 100)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <polygon points="0,-25 45,-2 0,21 -45,-2" fill="#047857" stroke="#10b981" stroke-width="1.5" />
      <polygon points="-45,-2 0,21 0,45 -45,22" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <polygon points="0,21 45,-2 45,22 0,45" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
    </g>

    <!-- Row 2 -->
    <g transform="translate(-45, 23)">
      <polygon points="0,-25 45,-2 0,21 -45,-2" fill="#059669" stroke="#34d399" stroke-width="1.5" />
      <polygon points="-45,-2 0,21 0,45 -45,22" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <polygon points="0,21 45,-2 45,22 0,45" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
    </g>
    <g transform="translate(45, 23)">
      <polygon points="0,-25 45,-2 0,21 -45,-2" fill="#059669" stroke="#34d399" stroke-width="1.5" />
      <polygon points="-45,-2 0,21 0,45 -45,22" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <polygon points="0,21 45,-2 45,22 0,45" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
    </g>

    <!-- Row 3 -->
    <g transform="translate(-90, 46)">
      <polygon points="0,-25 45,-2 0,21 -45,-2" fill="#047857" stroke="#10b981" stroke-width="1.5" />
      <polygon points="-45,-2 0,21 0,45 -45,22" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <polygon points="0,21 45,-2 45,22 0,45" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
    </g>
    <g transform="translate(0, 46)">
      <!-- Center water tile -->
      <polygon points="0,-25 45,-2 0,21 -45,-2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="-45,-2 0,21 0,45 -45,22" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="0,21 45,-2 45,22 0,45" fill="#075985" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Water ripple -->
      <ellipse cx="0" cy="0" rx="15" ry="6" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.8" />
    </g>
    <g transform="translate(90, 46)">
      <polygon points="0,-25 45,-2 0,21 -45,-2" fill="#047857" stroke="#10b981" stroke-width="1.5" />
      <polygon points="-45,-2 0,21 0,45 -45,22" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <polygon points="0,21 45,-2 45,22 0,45" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
    </g>

    <!-- Row 4 -->
    <g transform="translate(-45, 69)">
      <polygon points="0,-25 45,-2 0,21 -45,-2" fill="#059669" stroke="#34d399" stroke-width="1.5" />
      <polygon points="-45,-2 0,21 0,45 -45,22" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <polygon points="0,21 45,-2 45,22 0,45" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
    </g>
    <g transform="translate(45, 69)">
      <polygon points="0,-25 45,-2 0,21 -45,-2" fill="#059669" stroke="#34d399" stroke-width="1.5" />
      <polygon points="-45,-2 0,21 0,45 -45,22" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <polygon points="0,21 45,-2 45,22 0,45" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
    </g>

    <!-- Row 5 -->
    <g transform="translate(0, 92)">
      <polygon points="0,-25 45,-2 0,21 -45,-2" fill="#047857" stroke="#10b981" stroke-width="1.5" />
      <polygon points="-45,-2 0,21 0,45 -45,22" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <polygon points="0,21 45,-2 45,22 0,45" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
    </g>

    <!-- Wall Column on tile -->
    <g transform="translate(-45, 10)">
      <rect x="-10" y="-70" width="20" height="70" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
      <polygon points="0,-85 14,-70 -14,-70" fill="#64748b" stroke="#94a3b8" />
    </g>
  </g>

  <!-- Caption overlay -->
  <rect x="0" y="380" width="600" height="70" fill="black" opacity="0.75" />
  <text x="30" y="410" font-family="'Outfit', sans-serif" font-weight="700" font-size="17" fill="#ffffff">Mystic Mansion & Dungeon Tileset</text>
  <text x="30" y="432" font-family="'Outfit', sans-serif" font-size="13" fill="#34d399">Handcrafted Assets by oonori</text>
</svg>
