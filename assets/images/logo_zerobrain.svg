<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="500" height="500" rx="40" fill="#090d16" />
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#brainGrad)" stroke-width="2" opacity="0.25" />
  <circle cx="250" cy="250" r="180" fill="none" stroke="url(#neonGlow)" stroke-width="3" stroke-dasharray="8,6" opacity="0.6" />

  <!-- Cybernetic Polygon Brain -->
  <g filter="url(#glow)">
    <!-- Left Hemisphere -->
    <path d="M240,130 C180,130 140,170 140,230 C140,270 165,300 190,320 C180,345 200,370 230,370 L240,370 Z" 
          fill="url(#brainGrad)" opacity="0.85" />
    <!-- Right Hemisphere -->
    <path d="M260,130 C320,130 360,170 360,230 C360,270 335,300 310,320 C320,345 300,370 270,370 L260,370 Z" 
          fill="url(#neonGlow)" opacity="0.85" />
    
    <!-- Central Synaptic Core -->
    <polygon points="250,160 265,220 250,280 235,220" fill="#ffffff" opacity="0.9" />
    <circle cx="250" cy="220" r="12" fill="#00f2fe" />
    
    <!-- Cyber circuitry lines -->
    <line x1="170" y1="200" x2="230" y2="220" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="330" y1="200" x2="270" y2="220" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="180" y1="270" x2="230" y2="260" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="320" y1="270" x2="270" y2="260" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="250" y1="280" x2="250" y2="340" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Nodes -->
  <circle cx="170" cy="200" r="5" fill="#00f2fe" />
  <circle cx="330" cy="200" r="5" fill="#ec4899" />
  <circle cx="180" cy="270" r="5" fill="#00f2fe" />
  <circle cx="320" cy="270" r="5" fill="#ec4899" />
  <circle cx="250" cy="340" r="6" fill="#7f00ff" />

  <!-- Studio Typography -->
  <text x="250" y="425" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="4">
    ZERO<tspan fill="#00f2fe">BRAIN</tspan>
  </text>
  <text x="250" y="450" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="6">
    GAME DEV STUDIO
  </text>
</svg>
